schema: spec-driven

context: |
  프로젝트: 냉털마스터 (Fridge-Master)
  "남는 재료만 넣으세요, 최고의 레시피를 찾아드립니다"

  Tech Stack:
  - Backend: Go (Golang)
  - Frontend: Vue.js
  - Database: MongoDB
  - AI Vision: Vertex AI (Google Cloud Vision API — OCR, Object Detection)
  - Storage: Google Cloud Storage (GCS)
  - External API: YouTube Data API v3, Google Custom Search

  Domain Capabilities:
  - auth: 사용자 인증 (JWT, email/password)
  - fridge: 냉장고 재료 관리 (CRUD + 유통기한)
  - vision: AI 이미지 인식 (영수증 OCR, 냉장고 사진)
  - recommendation: 레시피 추천 엔진 (3-Tier, 내부DB + 외부링크 혼합)
  - cookbook: 나만의 요리책 (저장/분류/평점)
  - notification: 유통기한 임박 알림 (D-3, D-1, D-day)

  Conventions:
  - REST API prefix: /api/v1/
  - MongoDB ObjectID for all primary keys
  - Go struct field naming: snake_case in DB, camelCase in JSON
  - 비동기 처리: VisionJob은 백그라운드 워커(Goroutine + Channel)

rules:
  proposal:
    - 제목은 한국어로 작성
    - Non-goals 섹션 필수 포함
    - MVP 범위를 명확히 구분
  tasks:
    - 각 태스크는 반나나 이내 완료 가능한 단위로 분리
    - 백엔드/프론트엔드 태스크 구분 명시
